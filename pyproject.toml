[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "featurepilot"
version = "0.1.0"
description = "A repo-aware CLI coding agent with Chat and Managed Run workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ai", "agent", "coding", "cli", "llm", "featurepilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0,<3.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["featurepilot"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
featurepilot = "featurepilot.cli:main"

[project.urls]
Homepage = "https://github.com/wshirley2/FeaturePilot"
Repository = "https://github.com/wshirley2/FeaturePilot"
Issues = "https://github.com/wshirley2/FeaturePilot/issues"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.pytest.ini_options]
norecursedirs = ["runs", ".featurepilot", ".git", ".venv", "venv", ".tmp", ".pytest_cache"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Tool/agent boundaries intentionally catch broad errors and return them as text.
    "RUF012",  # Tool schemas are immutable-by-convention class attributes.
    "S110",  # Context summarization intentionally falls back silently.
]
